[project]
name = "datascience-metrology-course"
version = "0.1.0"
description = "Course material: Data Skills with Python — จัดการข้อมูลจริง ตั้งแต่ไฟล์ดิบถึงรายงาน (2 วัน, ผู้เริ่มต้น)"
requires-python = ">=3.13,<3.15"
# Offline CPU stack — pandas foundation course (ADR-0001: pandas, not Polars;
# ADR-0002: no ML, no scikit-learn). Mirrors requirements-offline.txt (pip fallback).
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "requests==2.34.2",
    "jupyterlab==4.6.4",
    "ipykernel==7.3.0",
]

[tool.uv]
# Groups installed by plain `uv sync`. lint = material quality checks
# (repo convention: .venv/bin/nbqa flake8).
default-groups = ["lint"]
# Platforms the course targets.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[dependency-groups]
# Material quality checks (scripts/check_materials.sh): nbqa runs flake8 over
# notebooks using the repo-root .flake8 config.
lint = [
    "nbqa==1.9.1",
    "flake8==7.4.1",
]
